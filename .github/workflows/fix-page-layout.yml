name: Fix page composition
on:
  push:
    branches: [assets-diagnostico]
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Fix page composition') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets-diagnostico
          fetch-depth: 0
      - name: Fix composition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # HERO: keep the HTML headline, lead and real CTA. Crop the generated image to the person/lower visual only.
          s=re.sub(r'\.heroVisual\{[^}]*\}', '.heroVisual{width:100%;max-width:none;height:430px;margin:0;border-radius:34px;overflow:hidden;box-shadow:none}', s, count=1)
          s=re.sub(r'\.heroVisual picture,\.heroVisual img\{[^}]*\}', '.heroVisual picture,.heroVisual img{height:100%!important;display:block;width:100%}', s, count=1)
          s=re.sub(r'\.heroVisual img\{[^}]*\}', '.heroVisual img{object-fit:cover;object-position:center bottom}', s, count=1)
          s=s.replace('.heroVisual{border-radius:22px;height:auto}', '.heroVisual{border-radius:22px;height:320px}')

          # REMOVE ONLY the unwanted generated "Tus aplicaciones pueden terminar así" visual (descubre asset).
          patterns=[
            r'<section[^>]*class=["\'][^"\']*assetSection[^"\']*["\'][^>]*>(?:(?!</section>).)*?(?:descubre-(?:desktop|mobile)|descubre)(?:(?!</section>).)*?</section>',
            r'<div[^>]*class=["\'][^"\']*assetSection[^"\']*["\'][^>]*>(?:(?!</div>).)*?(?:descubre-(?:desktop|mobile)|descubre)(?:(?!</div>).)*?</div>'
          ]
          for pat in patterns:
            s=re.sub(pat,'',s,flags=re.S|re.I)

          # Also remove a standalone picture/img wrapper if the unwanted asset sits outside a section.
          s=re.sub(r'<(?:picture|div|figure)[^>]*>\s*(?:<picture[^>]*>\s*)?(?:.*?descubre-(?:desktop|mobile).*?)(?:</picture>\s*)?</(?:picture|div|figure)>','',s,flags=re.S|re.I)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit latest state and clean workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix page composition [skip actions]' || true
          git rm .github/workflows/fix-page-layout.yml .github/workflows/fix-hero-and-remove-discover.yml 2>/dev/null || true
          git rm .github/workflows/fix-hero-final.yml .github/workflows/fix-duplicate-visuals.yml 2>/dev/null || true
          git commit -m 'Clean temporary visual workflows [skip actions]' || true
          git fetch origin assets-diagnostico
          git push origin HEAD:assets-diagnostico --force-with-lease
