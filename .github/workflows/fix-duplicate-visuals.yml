name: Fix duplicate visual blocks
on:
  push:
    branches: [assets-diagnostico]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets-diagnostico
      - name: Remove duplicate visual blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = re.sub(r'<div\s+class=["\']assetVisual["\'][^>]*>.*?</div>', '', s, flags=re.S)
          if s == old:
              raise SystemExit('No assetVisual blocks found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove duplicated visual blocks [skip actions]'
          git push origin assets-diagnostico
      - name: Remove temporary workflows
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-duplicate-visuals.yml .github/workflows/remove-duplicate-assets.yml 2>/dev/null || true
          git commit -m 'Remove temporary visual cleanup workflows [skip actions]' || true
          git push origin assets-diagnostico || true
