name: Fix visual layout
on:
  push:
    branches: [assets-diagnostico]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets-diagnostico
      - name: Restore images and keep real HTML CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.hero>div:first-child{display:none}.hero{display:block;min-height:0;padding:0!important;', '')
          s = s.replace('@media(max-width:850px){.hero>div:first-child{display:none}.hero{display:block;min-height:0;padding:0}.showcase{grid-template-columns:1fr}.hero{padding:50px 25px}', '@media(max-width:850px){.hero,.showcase{grid-template-columns:1fr}.hero{padding:50px 25px}')
          s = s.replace('@media(max-width:540px){.hero>div:first-child{display:none}.hero{display:block;min-height:0;padding:0}.wrap{padding:0 12px 45px}', '@media(max-width:540px){.wrap{padding:0 12px 45px}')
          s = s.replace('.heroVisual{border-radius:22px;height:360px}', '.heroVisual{border-radius:22px;height:auto}')
          s = s.replace('.hero>div:first-child{display:none}', '.hero>div:first-child .eyebrow,.hero>div:first-child h1,.hero>div:first-child .lead{display:none}')
          s = s.replace('style="display:none"', 'style="display:block"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore images and CTA without duplicate copy [skip actions]' || true
          git rm .github/workflows/fix-duplicate-visuals.yml .github/workflows/fix-hero-layout.yml 2>/dev/null || true
          git commit -m 'Remove temporary visual workflows [skip actions]' || true
          git push origin assets-diagnostico
