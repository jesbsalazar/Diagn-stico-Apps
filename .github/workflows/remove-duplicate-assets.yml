name: Remove duplicate visual sections
on:
  push:
    branches: [assets-diagnostico]
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets-diagnostico
      - name: Remove duplicate asset sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = re.sub(r'<section\s+class=["\']assetSection["\'][^>]*>.*?</section>', '', s, flags=re.S)
          if s == old:
              raise SystemExit('No assetSection found; refusing to create a no-op commit')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit landing cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove duplicated visual sections [skip actions]'
          git push origin assets-diagnostico
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/remove-duplicate-assets.yml || true
          git commit -m 'Remove temporary duplicate cleanup workflow [skip actions]' || true
          git push origin assets-diagnostico || true
