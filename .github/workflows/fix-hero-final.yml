name: Fix hero final
on:
  push:
    branches: [assets-diagnostico]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets-diagnostico
      - name: Keep image copy, restore real CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Restore the missing .hero selector introduced by the previous cleanup.
          s = s.replace('.nav{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:11px 17px;font-weight:900;cursor:pointer}position:relative;overflow:hidden;', '.nav{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:11px 17px;font-weight:900;cursor:pointer}.hero{position:relative;overflow:hidden;', 1)
          # The generated hero image already contains the headline and explanatory copy.
          # Keep the real HTML CTA/trust line, but do not repeat the visual copy.
          css = '''
          .hero>div:first-child .eyebrow,.hero>div:first-child h1,.hero>div:first-child .lead{display:none!important}
          .hero>div:first-child{display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
          @media(max-width:850px){.hero{display:flex;flex-direction:column;align-items:stretch}.heroVisual{order:1}.hero>div:first-child{order:2;width:100%;align-items:center;text-align:center;padding-top:22px}.hero>div:first-child .actions{justify-content:center;width:100%}.hero>div:first-child .micro{justify-content:center;width:100%}}
          '''
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix hero duplication while keeping CTA [skip actions]' || true
          git rm .github/workflows/fix-hero-final.yml
          git commit -m 'Remove temporary hero final workflow [skip actions]'
          git push origin assets-diagnostico
