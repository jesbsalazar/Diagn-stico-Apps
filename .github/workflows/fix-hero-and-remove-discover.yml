name: Adjust hero and remove unwanted visual
on:
  push:
    branches: [assets-diagnostico]
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Adjust hero and remove unwanted visual') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets-diagnostico
      - name: Apply page layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the hero HTML headline/lead/CTA, but crop the hero image so only the person/visual lower portion is shown.
          s = re.sub(r'\.heroVisual\{[^}]*\}', '.heroVisual{width:100%;max-width:none;height:430px;margin:0;border-radius:34px;overflow:hidden;box-shadow:none}', s, count=1)
          s = re.sub(r'\.heroVisual picture,\.heroVisual img\{[^}]*\}', '.heroVisual picture,.heroVisual img{height:100%!important;display:block;width:100%}', s, count=1)
          s = re.sub(r'\.heroVisual img\{[^}]*\}', '.heroVisual img{object-fit:cover;object-position:center bottom}', s, count=1)
          s = s.replace('.heroVisual{border-radius:22px;height:auto}', '.heroVisual{border-radius:22px;height:320px}')

          # Remove only the unwanted "Tus aplicaciones pueden dominar así" / app-wall visual section.
          # It is the generated descubre asset; leave the other visual assets intact.
          s = re.sub(r'<section[^>]*class="assetSection"[^>]*>\s*.*?<img[^>]+(?:descubre-(?:desktop|mobile)|descubre)[^>]*>.*?</section>', '', s, flags=re.S|re.I)

          # If the image is wrapped differently, remove an asset section whose picture/src references descubre.
          s = re.sub(r'<section[^>]*class="assetSection"[^>]*>\s*(?:(?!</section>).)*?(?:descubre-(?:desktop|mobile)|descubre)(?:(?!</section>).)*?</section>', '', s, flags=re.S|re.I)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Adjust hero and remove unwanted visual [skip actions]' || true
          git rm .github/workflows/fix-hero-and-remove-discover.yml 2>/dev/null || true
          git commit -m 'Remove temporary visual workflow [skip actions]' || true
          git push origin assets-diagnostico
