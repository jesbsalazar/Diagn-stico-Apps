name: Remove visual duplication

on:
  push:
    branches: [assets-diagnostico]
    paths:
      - '.github/workflows/remove-visual-duplication.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets-diagnostico
          fetch-depth: 1
      - name: Clean duplicated landing copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.heroVisual{width:100%;max-width:560px;margin:auto;border-radius:28px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.2)}.heroVisual picture,.heroVisual img,.assetVisual picture,.assetVisual img{display:block;width:100%;height:auto}', '.heroVisual{width:100%;max-width:560px;height:430px;margin:auto;border-radius:28px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.2)}.heroVisual picture,.heroVisual img,.assetVisual picture,.assetVisual img{display:block;width:100%;height:auto}.heroVisual picture,.heroVisual img{height:100%}.heroVisual img{object-fit:cover;object-position:center bottom}')
          s=s.replace('.assetVisual{border-radius:30px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 18px 55px rgba(7,26,53,.1)}', '.assetVisual{border-radius:30px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 18px 55px rgba(7,26,53,.1);margin-top:0}.assetSection .assetCaption,.assetSection .kicker,.assetSection>h2{display:none}')
          s=s.replace('<div class="assetSection"><div class="kicker center">VISUALIZA EL PROBLEMA</div><h2 class="center">¿Te suena familiar?</h2><p class="assetCaption">Cada suscripción parece pequeña hasta que las ves todas juntas.</p><div class="assetVisual">', '<div class="assetSection"><div class="assetVisual">')
          s=s.replace('<div class="assetSection"><div class="kicker center">DESCUBRE LO QUE ESTÁ PASANDO</div><h2 class="center">Mira tus aplicaciones con otros ojos.</h2><p class="assetCaption">El diagnóstico convierte tus suscripciones en una decisión clara.</p><div class="assetVisual">', '<div class="assetSection"><div class="assetVisual">')
          s=s.replace('<div class="assetSection"><div class="kicker center">EL RECORRIDO</div><h2 class="center">Así funciona el diagnóstico.</h2><p class="assetCaption">Cuatro pasos simples para saber qué dejar, qué quitar y qué aprender.</p><div class="assetVisual">', '<div class="assetSection"><div class="assetVisual">')
          s=s.replace('.heroVisual{border-radius:22px}', '.heroVisual{border-radius:22px;height:360px}')
          git_msg='Remove duplicated visual copy from landing'
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-visual-duplication.yml
          git commit -m "Remove duplicated visual copy from landing [skip actions]"
          git push origin assets-diagnostico