name: Restore visual sections
on:
  push:
    branches: [assets-diagnostico]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore generated visuals and remove duplicate HTML copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.heroVisual{width:100%;max-width:560px;height:430px;margin:auto;border-radius:28px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.2)}','.heroVisual{width:100%;max-width:none;height:auto;margin:0;border-radius:34px;overflow:hidden;box-shadow:none}.heroVisual picture,.heroVisual img{height:auto!important}')
          s=s.replace('.heroVisual picture,.heroVisual img{height:100%}.heroVisual img{object-fit:cover;object-position:center bottom}','.heroVisual img{object-fit:contain;object-position:center}')
          s=s.replace('@media(max-width:540px){.wrap{padding:0 12px 45px}', '@media(max-width:540px){.hero>div:first-child{display:none}.hero{display:block;min-height:0;padding:0}.wrap{padding:0 12px 45px}')
          s=s.replace('@media(max-width:850px){.hero,.showcase{grid-template-columns:1fr}', '@media(max-width:850px){.hero>div:first-child{display:none}.hero{display:block;min-height:0;padding:0}.showcase{grid-template-columns:1fr}')
          s=s.replace('.assetVisual{border-radius:30px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 18px 55px rgba(7,26,53,.1);margin-top:0;display:none}', '.assetVisual{border-radius:30px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 18px 55px rgba(7,26,53,.1);margin-top:0;display:block}.assetVisual picture,.assetVisual img{display:block;width:100%;height:auto}')
          s=s.replace('.assetSection .assetCaption,.assetSection .kicker,.assetSection>h2{display:none}', '')
          s=s.replace('<div class="assetSection"></div>\n<div class="showcase">', '<div class="assetSection"><div class="assetVisual"><picture><source media="(max-width:540px)" srcset="problema-mobile.PNG"><img src="problema-desktop.PNG" alt="El problema de pagar por aplicaciones que no necesitas"></picture></div></div>\n<div class="showcase" style="display:none">')
          s=s.replace('<div class="assetSection"></div>\n<div class="steps">', '<div class="assetSection"><div class="assetVisual"><picture><source media="(max-width:540px)" srcset="descubre-mobile.PNG"><img src="descubre-desktop.PNG" alt="Descubre cuánto gastas en tus aplicaciones"></picture></div></div>\n<div class="steps" style="display:none">')
          s=s.replace('<div class="assetSection"></div>\n<div class="ctaBand">', '<div class="assetSection"><div class="assetVisual"><picture><source media="(max-width:540px)" srcset="como-funciona-mobile.PNG"><img src="como-funciona-desktop.PNG" alt="Cómo funciona el diagnóstico de aplicaciones en 3 minutos"></picture></div></div>\n<div class="ctaBand">')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore visual assets and remove duplicate copy'
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/restore-visuals.yml
          git commit -m 'Remove temporary visual workflow [skip actions]'
          git push
