name: Fix hero layout
on:
  push:
    branches: [assets-diagnostico]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore HTML CTA without duplicate hero copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.hero>div:first-child{display:none}.hero{display:block;min-height:0;padding:0!important;', '')
          s=s.replace('@media(max-width:850px){.hero>div:first-child{display:none}.hero{display:block;min-height:0;padding:0}.showcase{grid-template-columns:1fr}.hero{padding:50px 25px}', '@media(max-width:850px){.hero,.showcase{grid-template-columns:1fr}.hero{padding:50px 25px}')
          s=s.replace('@media(max-width:540px){.hero>div:first-child{display:none}.hero{display:block;min-height:0;padding:0}.wrap{padding:0 12px 45px}', '@media(max-width:540px){.wrap{padding:0 12px 45px}')
          s=s.replace('.heroVisual{border-radius:22px;height:360px}', '.heroVisual{border-radius:22px;height:auto}')
          s=s.replace('.hero>div:first-child{display:none}', '.hero>div:first-child .eyebrow,.hero>div:first-child h1,.hero>div:first-child .lead{display:none}')
          s=s.replace('<div class="hero"><div><div class="eyebrow">DIAGNÓSTICO GRATUITO · 3 MINUTOS</div>', '<div class="hero"><div>')
          s=s.replace('</div><div class="heroVisual"><picture>', '</div><div class="heroVisual"><picture>', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore CTA and remove duplicate hero copy [skip actions]' || exit 0
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-hero-layout.yml
          git commit -m 'Remove temporary hero layout workflow [skip actions]'
          git push
