name: Hide duplicate visual images
on:
  push:
    branches: [assets-diagnostico]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets-diagnostico
      - name: Hide asset visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.assetVisual{border-radius:30px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 18px 55px rgba(7,26,53,.1);margin-top:0}'
          new = old[:-1] + ';display:none}'
          if old not in s:
              raise SystemExit('Expected assetVisual CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hide duplicated visual images [skip actions]'
          git push origin assets-diagnostico
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hide-duplicate-visuals.yml 2>/dev/null || true
          git commit -m 'Remove temporary visual workflow [skip actions]' || true
          git push origin assets-diagnostico || true
